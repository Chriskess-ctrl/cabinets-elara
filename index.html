<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#251d19"><meta name="description" content="Les Cabinets Secrets d'Elara, compagnon de lecture interactif."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>Les Cabinets Secrets d’Elara</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--ink:#32271f;--cream:#f4eddf;--paper:#faf5e9;--gold:#c7a777;--muted:#796c5d;--line:#d9cbb5}*{box-sizing:border-box}body{margin:0;background:#171310;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}#app{max-width:520px;margin:auto;min-height:100dvh;background:var(--cream);padding-bottom:86px;box-shadow:0 0 50px #0007}.hero{position:relative;min-height:330px;background:radial-gradient(ellipse at 20% 10%,#75604455,transparent 42%),radial-gradient(ellipse at 85% 75%,#98784e44,transparent 40%),linear-gradient(155deg,#352820,#171412 75%);color:#f8ead1;padding:34px 23px 26px;overflow:hidden}.hero:before{content:'✧';position:absolute;right:-28px;top:15px;font-size:230px;color:#b08c5530;transform:rotate(20deg)}.hero:after{content:'';position:absolute;left:22px;bottom:24px;width:80%;height:1px;background:linear-gradient(90deg,transparent,#c7a777,transparent)}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#e2c69c}.hero h1{font:600 46px/0.93 'Cormorant Garamond',serif;letter-spacing:-1px;margin:23px 0 13px;max-width:320px}.hero p{font:19px/1.25 'Cormorant Garamond',serif;color:#d9c7ad;max-width:270px}.seal{position:absolute;right:27px;bottom:55px;width:94px;height:94px;border:1px solid #bfa076;border-radius:50%;display:grid;place-items:center;font:54px 'Cormorant Garamond',serif;color:#dec49c;box-shadow:0 0 0 7px #bfa07615}.content{padding:22px 20px 28px}.section-title{font:600 31px/1 'Cormorant Garamond',serif;margin:5px 0 9px}.intro{color:var(--muted);line-height:1.55;margin:0 0 20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;color:var(--ink);padding:0;box-shadow:0 5px 13px #4b342211}.art{height:134px;display:flex;align-items:center;justify-content:center;font-size:70px;position:relative;overflow:hidden}.art.forest{background:radial-gradient(circle at 45% 30%,#f7e9c3,#b2a27f 55%,#4c5947)}.art.sea{background:radial-gradient(circle at 60% 20%,#e2cb9b,#68838b 50%,#243f52)}.art.music{background:radial-gradient(circle at 45% 35%,#aa815b,#30251d)}.art.notes{background:radial-gradient(circle at 45% 35%,#d9bf91,#8b7152)}.card-body{padding:12px}.card h3{font:600 24px/1 'Cormorant Garamond',serif;margin:0 0 5px}.card small{color:var(--muted);font-size:11px}.tag{font-size:10px;letter-spacing:1.6px;color:#987b50;text-transform:uppercase;font-weight:700}.wide{grid-column:1/-1}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:17px;margin:13px 0}.panel h3{font:600 25px 'Cormorant Garamond',serif;margin:0 0 8px}.panel p{line-height:1.5;color:#66594b}.menu-item{width:100%;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);background:#fcf8ee;border-radius:9px;padding:15px;margin:10px 0;color:var(--ink)}.menu-item .symbol{font-size:31px;width:43px;text-align:center}.menu-item b{display:block;font:600 22px 'Cormorant Garamond',serif}.menu-item small{color:var(--muted)}.arrow{margin-left:auto;font-size:23px;color:#a08b6c}.top{background:#29221d;color:#f4e8d5;padding:19px 20px 18px;display:flex;align-items:center;gap:12px}.top button{background:none;color:inherit;border:0;font-size:23px;padding:3px}.top h2{font:600 29px/1 'Cormorant Garamond',serif;margin:0}.top small{color:#d0bda3;font-size:10px;letter-spacing:1.3px;text-transform:uppercase}.pagehead{padding:26px 20px 15px;background:linear-gradient(145deg,#eee3cc,#f8f0e1);border-bottom:1px solid var(--line)}.pagehead h2{font:600 40px/1 'Cormorant Garamond',serif;margin:8px 0}.pagehead p{color:var(--muted);line-height:1.45;margin:0}.botanical{font-size:54px;text-align:center;margin:8px 0}.field{display:block;width:100%;background:#fffdf7;border:1px solid #cbbb9f;border-radius:7px;padding:12px;color:var(--ink);margin:8px 0 12px}textarea.field{min-height:125px;resize:vertical}.primary{background:#302720;color:#fff2dc;border:1px solid #302720;border-radius:7px;padding:12px 16px;font-weight:600}.secondary{background:transparent;border:1px solid #a78e69;color:#473728;border-radius:7px;padding:10px 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.list{display:grid;gap:10px}.note{background:#fffcf4;border:1px solid var(--line);padding:13px;border-radius:8px}.note h4{margin:0 0 4px;font:600 23px 'Cormorant Garamond',serif}.note small{color:var(--muted)}.note p{white-space:pre-wrap;line-height:1.5}.note button{border:0;background:none;color:#78543e;padding:7px 8px 7px 0}.pill{display:inline-block;border:1px solid #d5c6ad;background:#f7eedf;border-radius:20px;padding:6px 10px;font-size:11px;color:#755b3d}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);background:#211b17;color:#c9b79f;padding:8px 2px max(8px,env(safe-area-inset-bottom));z-index:5;border-top:1px solid #755b3c}.bottom button{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:4px 0}.bottom button.active{color:#f4d7a2}.bottom span{font-size:22px}.empty{padding:25px 10px;text-align:center;color:var(--muted);font-style:italic}.notice{font-size:12px;color:#736554;line-height:1.5}.track{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fffaf0;border:1px solid var(--line);padding:12px;border-radius:8px;margin:8px 0}.track strong{display:block}.track small{color:var(--muted)}audio{width:100%;margin:12px 0}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.footer{font-size:11px;color:#8b7a65;text-align:center;margin:20px 0}.detail-image{height:185px;background:linear-gradient(130deg,#e9dec6,#a4ac8c);display:grid;place-items:center;font-size:100px;border-radius:8px;margin-bottom:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sr-only{position:absolute;left:-9999px}@media(min-width:600px){body{padding:20px 0}#app{border-radius:14px;overflow:hidden;min-height:calc(100dvh - 40px)}}
</style></head><body><div id="app"></div><script>
const plants=[{id:'romarin',name:'Romarin',latin:'Salvia rosmarinus',emoji:'🌿',desc:'Un arbrisseau aromatique méditerranéen aux feuilles persistantes et au parfum résineux.',notes:'Observer ses feuilles étroites, sa floraison et son parfum. Pour tout usage alimentaire ou cosmétique, se référer à des sources fiables et aux précautions adaptées.'},{id:'lavande',name:'Lavande vraie',latin:'Lavandula angustifolia',emoji:'🪻',desc:'Une plante parfumée aux épis violets, familière des jardins secs et ensoleillés.',notes:'Noter la date de floraison, les insectes visiteurs et les conditions de récolte.'},{id:'thym',name:'Thym',latin:'Thymus vulgaris',emoji:'🌱',desc:'Petit sous-arbrisseau des terres sèches, aux feuilles minuscules et aromatiques.',notes:'Comparer les parfums des différentes variétés et consigner leur exposition.'},{id:'calendula',name:'Souci officinal',latin:'Calendula officinalis',emoji:'🌼',desc:'Fleur orangée appréciée dans les jardins de simples et les compositions botaniques.',notes:'Observer les capitules et noter la période de floraison.'}];
const recipes=[{id:'sachet',name:'Sachet parfumé du foyer',emoji:'🧺',time:'15 min',ingredients:['Un petit sachet de tissu','Quelques brins de lavande bien secs','Un ruban'],steps:['Vérifier que les plantes sont parfaitement sèches.','Déposer la lavande dans le sachet.','Fermer avec le ruban et placer dans un tiroir.'],warning:'Usage décoratif uniquement. Tenir hors de portée des jeunes enfants et animaux.'},{id:'marque',name:'Marque-page botanique',emoji:'📜',time:'25 min',ingredients:['Papier épais','Feuilles déjà pressées et sèches','Colle adaptée au papier'],steps:['Disposer les feuilles sur le papier.','Fixer délicatement et laisser sécher.','Écrire le nom et la date de la récolte.'],warning:'Ne cueillir que les végétaux autorisés et correctement identifiés.'}];
const KEY='elara-cabinets-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{notes:[],plantNotes:{},favorites:[],code:''}}catch{state={notes:[],plantNotes:{},favorites:[],code:''}};let page='home',sub='',editing=null,objectUrl=null;const app=document.getElementById('app');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nav=(p,s='')=>{page=p;sub=s;render();window.scrollTo(0,0)};const head=(title,kicker='Les Cabinets Secrets')=>`<header class="top"><button aria-label="Retour" onclick="goBack()">‹</button><div><small>${kicker}</small><h2>${title}</h2></div></header>`;const btn=(label,p,s='',emoji='✦',caption='')=>`<button class="menu-item" onclick="nav('${p}','${s}')"><span class="symbol">${emoji}</span><span><b>${label}</b><small>${caption}</small></span><span class="arrow">›</span></button>`;function goBack(){if(['plant','recipe','noteedit'].includes(page))nav(page==='plant'?'herbarium':page==='recipe'?'recipes':'journal');else if(['herbarium','recipes','journal'].includes(page))nav('foyer');else nav('home')}
function home(){return `<section class="hero"><div class="eyebrow">Elara Wynnstone · La bibliothèque vivante</div><h1>Les Cabinets Secrets<br>d’Elara</h1><p>Des livres, des musiques et des carnets à faire vivre…</p><div class="seal">E</div></section><main class="content"><div class="tag">Poussez une porte</div><h2 class="section-title">Choisissez votre univers</h2><p class="intro">Chaque grimoire possède son cabinet. Vos notes restent à vous, sur cet appareil.</p><div class="cards"><button class="card" onclick="nav('foyer')"><div class="art forest">🌿</div><div class="card-body"><div class="tag">Ouvert</div><h3>Le Foyer d’Elara</h3><small>Herbier · Recettes · Carnet</small></div></button><button class="card" onclick="nav('marées')"><div class="art sea">⛵</div><div class="card-body"><div class="tag">À découvrir</div><h3>Les Marées d’Elara</h3><small>Journal de bord · Cartes</small></div></button><button class="card wide" onclick="nav('music')"><div class="card-body"><h3>♫ La Chambre des Échos</h3><small>Vos futures musiques Suno, au cœur de chaque lecture</small></div></button></div><div class="panel"><h3>✒️ Votre carnet vous attend</h3><p>${state.notes.length?`Vous avez déjà ${state.notes.length} note(s) dans votre carnet.`:'Consignez votre première observation ou votre idée de lecture.'}</p><button class="primary" onclick="nav('journal')">Ouvrir mon carnet →</button></div><div class="footer">Prototype privé · Version 0.1</div></main>`}
function foyer(){return head('Le Foyer d’Elara','Cabinet du grimoire')+`<section class="pagehead"><div class="botanical">🌿 🕯️ 📜</div><h2>Le Cabinet du Foyer</h2><p>Un espace pour cultiver vos observations, vos gestes et vos souvenirs du quotidien.</p></section><main class="content">${btn('Mon herbier','herbarium','','🌱','Quatre plantes à explorer et annoter')}${btn('Mes recettes','recipes','','🧺','Deux créations simples à essayer')}${btn('Mon carnet du foyer','journal','','✒️','Vos notes personnelles')}${btn('Musiques du foyer','music','','🎼','Ambiances à écouter')}<div class="panel"><h3>À propos de ce cabinet</h3><p>Les contenus de cette démonstration sont originaux et provisoires. Les fiches définitives seront adaptées au texte du grimoire publié.</p></div></main>`}
function herbarium(){return head('Mon herbier','Le Cabinet du Foyer')+`<main class="content"><h2 class="section-title">Plantes du foyer</h2><p class="intro">Ouvrez une fiche pour découvrir la plante et écrire vos propres observations.</p>${plants.map(p=>btn(p.name,'plant',p.id,p.emoji,p.latin)).join('')}</main>`}
function plant(){let p=plants.find(x=>x.id===sub)||plants[0];return head(p.name,'L’herbier d’Elara')+`<main class="content"><div class="detail-image">${p.emoji}</div><div class="tag">Fiche botanique</div><h2 class="section-title">${p.name}</h2><p class="muted"><i>${p.latin}</i></p><div class="panel"><h3>Observer</h3><p>${p.desc}</p><h3>Dans mon carnet</h3><p>${p.notes}</p></div><label for="plantnote"><b>Mes observations personnelles</b></label><textarea class="field" id="plantnote" placeholder="Date, lieu, parfum, croquis à prévoir…">${esc(state.plantNotes[p.id]||'')}</textarea><button class="primary" onclick="savePlant('${p.id}')">Enregistrer mes observations</button><p class="notice">Les notes sont sauvegardées localement sur cet appareil.</p></main>`}
function savePlant(id){state.plantNotes[id]=document.getElementById('plantnote').value;save();toast('Observations enregistrées ✓')}
function recipesPage(){return head('Mes recettes','Le Cabinet du Foyer')+`<main class="content"><h2 class="section-title">L’atelier des gestes</h2><p class="intro">De petites créations à refaire chez soi, accompagnées de leurs étapes.</p>${recipes.map(r=>btn(r.name,'recipe',r.id,r.emoji,r.time)).join('')}<p class="notice">Les recettes présentées sont des activités artisanales, pas des conseils médicaux.</p></main>`}
function recipePage(){let r=recipes.find(x=>x.id===sub)||recipes[0];return head(r.name,'L’atelier du foyer')+`<main class="content"><div class="detail-image">${r.emoji}</div><div class="tag">Création du foyer · ${r.time}</div><h2 class="section-title">${r.name}</h2><div class="panel"><h3>À préparer</h3><ul>${r.ingredients.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Le geste, étape par étape</h3><ol>${r.steps.map(x=>`<li style="margin:9px 0">${esc(x)}</li>`).join('')}</ol></div><p class="notice">${r.warning}</p><button class="primary" onclick="newNote('${esc(r.name).replace(/'/g,'&#39;')}')">Ajouter une note sur cette recette</button></main>`}
function journal(){return head('Mon carnet','Pages personnelles')+`<main class="content"><div class="tag">Votre mémoire de lecture</div><h2 class="section-title">Les pages à vous</h2><p class="intro">Un espace intime pour vos essais, observations et idées. Rien n'est envoyé sur un serveur.</p><button class="primary" onclick="newNote()">＋ Nouvelle note</button><div class="row" style="margin:14px 0"><button class="secondary" onclick="exportNotes()">↓ Exporter mes notes</button><label class="secondary" style="cursor:pointer">↑ Importer une sauvegarde<input type="file" accept="application/json" style="display:none" onchange="importNotes(event)"></label></div><input class="field" id="search" placeholder="Rechercher dans mon carnet…" oninput="drawNotes()"><div id="noteslist"></div><p class="notice">Attention : si vous effacez les données du navigateur ou changez de téléphone, vos notes locales peuvent disparaître. Exportez-les régulièrement.</p></main>`}
function drawNotes(){const box=document.getElementById('noteslist');if(!box)return;const q=(document.getElementById('search')?.value||'').toLowerCase();const arr=state.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));box.innerHTML=arr.length?`<div class="list">${arr.map(n=>`<article class="note"><small>${new Date(n.date).toLocaleDateString('fr-FR')}</small><h4>${esc(n.title||'Sans titre')}</h4><p>${esc(n.body).slice(0,360)}</p><button onclick="editNote('${n.id}')">✎ Modifier</button><button onclick="deleteNote('${n.id}')">× Supprimer</button></article>`).join('')}</div>`:'<div class="empty">Aucune note pour le moment.</div>'}
function newNote(title=''){editing=null;nav('noteedit');document.getElementById('ntitle').value=title}function editNote(id){editing=id;nav('noteedit')}function noteEdit(){let n=state.notes.find(x=>x.id===editing);return head(n?'Modifier ma note':'Nouvelle note','Mon carnet')+`<main class="content"><label for="ntitle"><b>Titre</b></label><input id="ntitle" class="field" maxlength="120" placeholder="Ex. Mon essai de romarin" value="${esc(n?.title||'')}"><label for="nbody"><b>Mes mots</b></label><textarea id="nbody" class="field" style="min-height:260px" placeholder="Aujourd'hui, j'ai découvert…">${esc(n?.body||'')}</textarea><button class="primary" onclick="saveNote()">Enregistrer la page</button> <button class="secondary" onclick="nav('journal')">Annuler</button></main>`}function saveNote(){const title=document.getElementById('ntitle').value.trim(),body=document.getElementById('nbody').value.trim();if(!title&&!body){toast('Écrivez au moins quelques mots.');return}if(editing){let n=state.notes.find(x=>x.id===editing);if(n){n.title=title;n.body=body;n.date=new Date().toISOString()}}else state.notes.unshift({id:String(Date.now()),title,body,date:new Date().toISOString()});save();editing=null;nav('journal');toast('Page enregistrée ✓')}function deleteNote(id){if(confirm('Supprimer définitivement cette note ?')){state.notes=state.notes.filter(n=>n.id!==id);save();drawNotes()}}
function exportNotes(){let blob=new Blob([JSON.stringify({format:'elara-cabinets-v1',exported:new Date().toISOString(),notes:state.notes,plantNotes:state.plantNotes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mon-carnet-elara.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importNotes(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.notes))throw Error();if(!confirm('Importer cette sauvegarde ? Les notes existantes seront conservées et les doublons évités.'))return;let ids=new Set(state.notes.map(n=>n.id));for(let n of d.notes)if(n&&typeof n.body==='string'&&!ids.has(n.id)){state.notes.push({id:String(n.id||Date.now()+Math.random()),title:String(n.title||''),body:n.body,date:n.date||new Date().toISOString()});ids.add(n.id)}if(d.plantNotes&&typeof d.plantNotes==='object')state.plantNotes={...state.plantNotes,...d.plantNotes};save();nav('journal');toast('Sauvegarde importée ✓')}catch{toast('Ce fichier ne semble pas être une sauvegarde Elara valide.')}};r.readAsText(f)}
function music(){return head('La Chambre des Échos','Musiques d’Elara')+`<section class="pagehead"><div class="botanical">🎼 🕯️</div><h2>Les ambiances de lecture</h2><p>Un refuge sonore pour accompagner chaque grimoire.</p></section><main class="content"><div class="panel"><h3>🎶 Écouter une création Suno</h3><p>La musique n'est pas encore intégrée à cette démonstration. Vous pouvez néanmoins essayer le lecteur avec un fichier audio présent sur votre téléphone.</p><label class="secondary" style="display:inline-block;cursor:pointer">Choisir un fichier audio<input id="audiofile" type="file" accept="audio/*" style="display:none" onchange="loadAudio(event)"></label><div id="audiozone"></div></div><div class="tag">Sélection à venir</div>${[['🌿','Le Foyer au crépuscule','Piano doux · Ambiance du foyer'],['🕯️','L’Atelier des simples','Cordes délicates · Herboristerie'],['⛵','La Route des Marées','Cordes maritimes · Aventure']].map(x=>`<div class="track"><span style="font-size:30px">${x[0]}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span><span class="arrow">♫</span></div>`).join('')}<p class="notice">Les titres ci-dessus sont des emplacements de démonstration, pas des pistes audio disponibles. Les fichiers définitifs seront ajoutés après vérification de leurs droits de diffusion.</p></main>`}
function loadAudio(e){let f=e.target.files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);document.getElementById('audiozone').innerHTML=`<p><b>${esc(f.name)}</b></p><audio controls src="${objectUrl}"></audio><p class="notice">Ce fichier est lu localement et n'est pas envoyé. Il faudra le sélectionner de nouveau lors de la prochaine visite.</p>`}
function sea(){return head('Les Marées d’Elara','La Sorcière Pirate')+`<section class="pagehead" style="background:linear-gradient(145deg,#d7d5c6,#9eafad)"><div class="botanical">🧭 ⛵ 🐚</div><h2>Le Journal des Marées</h2><p>Une nouvelle porte de la bibliothèque, encore en préparation.</p></section><main class="content">${btn('Journal de bord','journal','','📜','Écrivez déjà vos premières pages')}${btn('Chants des Marées','music','','🎼','Découvrez le futur espace musical')}<div class="panel"><h3>La carte des mers</h3><p>La carte interactive et les artefacts arriveront dans une prochaine version, à partir du manuscrit définitif de la Sorcière Pirate.</p></div></main>`}
function library(){return head('La Bibliothèque','Elara Wynnstone')+`<main class="content"><h2 class="section-title">Vos univers</h2>${btn('Le Grimoire des Secrets du Foyer','foyer','','🌿','Cabinet disponible en démonstration')}${btn('La Sorcière Pirate — Les Potions des Marées','marées','','⛵','Première porte ouverte')}<div class="panel"><h3>Un cabinet pour chaque livre</h3><p>Les futurs ouvrages d'Elara pourront rejoindre cette bibliothèque sans multiplier les applications.</p></div></main>`}
function more(){return head('Mon espace','À propos et sauvegardes')+`<main class="content"><h2 class="section-title">Votre cabinet personnel</h2><div class="panel"><h3>🔑 Accès lecteur</h3><p>La validation de codes imprimés dans les livres sera développée après définition du parcours KDP. Ce prototype n'effectue pas de vérification de code.</p></div><div class="panel"><h3>💌 La lettre d'Elara</h3><p>Une future inscription facultative, distincte de l'accès aux bonus. Aucun e-mail n'est collecté par cette démonstration.</p></div>${btn('Exporter mes notes','journal','','📥','Conservez une sauvegarde personnelle')}<div class="panel"><h3>Confidentialité</h3><p>Vos notes et observations sont conservées dans le stockage local de votre navigateur. Il n'y a ni compte, ni base de données distante, ni collecte d'adresse e-mail dans ce prototype.</p></div><p class="footer">Les Cabinets Secrets d'Elara · Prototype 0.1</p></main>`}
function render(){let pages={home,foyer,herbarium,plant,recipes:recipesPage,recipe:recipePage,journal,noteedit:noteEdit,music,marées:sea,library,more};let active=['foyer','herbarium','plant','recipes','recipe'].includes(page)?'library':['noteedit','journal'].includes(page)?'journal':page==='marées'?'library':page;app.innerHTML=(pages[page]||home)()+`<nav class="bottom" aria-label="Navigation principale">${[['home','⌂','Accueil'],['library','▤','Livres'],['music','♫','Musiques'],['journal','✎','Mon carnet'],['more','☷','Plus']].map(([p,ic,t])=>`<button class="${active===p?'active':''}" onclick="nav('${p}')"><span>${ic}</span>${t}</button>`).join('')}</nav>`;if(page==='journal')drawNotes()}
function toast(s){let t=document.createElement('div');t.textContent=s;t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;background:#29221d;color:#f5e6cb;padding:13px 20px;border-radius:9px;box-shadow:0 5px 22px #0005;max-width:90vw;text-align:center';document.body.append(t);setTimeout(()=>t.remove(),2400)}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
